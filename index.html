<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <title>search.zoek</title>
    <style>
     
  .geel {
  color: #FFFF00;
  }
  .blauw {
  color: #0000FF;
  }
  .groen { 
  color:  #008000;
  }

       .zoeken {
           text-decoration: none;
           display: inline-block;
  margin-left: 8px;
  padding: 15px 24px;
  font-size: 16px;
  font-weight: bold;
  color: white;
  background-color: #0000FF;
  border: none;
  border-radius: 25px;
  cursor: pointer;
  box-shadow: 0 2px 5px rgba(0, 0, 0, 0.15);
  transition: all 0.2s ease;
}

.zoeken:hover {
  background-color: #008000;
  transform: translateY(-2px);
  box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
}

.zoeken:active {
  transform: translateY(0);
}

      button {
            margin-top: 25px;
            padding: 10px 20px;
            font-size: 14px;
            background-color: #f8f9fa;
            border: 1px solid #f8f9fa;
            border-radius: 4px;
            color: #3c4043;
            cursor: pointer;
        }
    input {
  width: 300px;
  padding: 12px 20px;
  font-size: 16px;
  border: 1px solid #ccc;
  border-radius: 25px;
  outline: none;
  box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
}

input:focus {
  border-color: #0000FF;
  box-shadow: 0 2px 8px rgba(0, 0, 0, 0.2);
}
         </style>

</head>
  <body>
      <h1><span class="geel">search</span><span class="blauw">.</span><span class="groen">zoek</span></h1>
    
    <!-- Verander je form-regel naar dit: -->
<form id="zoekformulier">
    <input type="text" name="q" placeholder="Zoek op het web..." required autofocus>
    <button type="submit">Zoeken</button>
</form>

<!-- Jouw links en tekst -->
<div id="resultaten"></div>

<!-- Het Wikipedia-venster -->
<iframe id="wiki-venster" style="width: 100%; max-width: 800px; height: 500px; border: 1px solid #ccc; border-radius: 10px; margin-top: 20px; display: none;"></iframe>

<script>
    const formulier = document.getElementById('zoekformulier');
    const resultatenVak = document.getElementById('resultaten');
    const wikiVenster = document.getElementById('wiki-venster');

    formulier.addEventListener('submit', function(event) {
        event.preventDefault();
        const zoekwoord = formulier.q.value;

        // 1. Zet ?q=... in je adresbalk
        window.history.pushState({}, '', '?q=' + encodeURIComponent(zoekwoord));

        // 2. Toon de links voor Google en YouTube
        resultatenVak.innerHTML = `
            <h3>Resultaten voor: "${zoekwoord}"</h3>
            <p><a href="https://google.com/search?q=${encodeURIComponent(zoekwoord)}" target="_blank" class="zoeken">Zoek op Google →</a></p>
            <p><a href="https://youtube.com/results?search_query=${encodeURIComponent(zoekwoord)}" target="_blank" class="zoeken">Zoek op YouTube →</a></p>
        `;

        // 3. Toon het Wikipedia-venster direct op je pagina
        wikiVenster.style.display = 'block';
        wikiVenster.src = `https://nl.wikipedia.org/w/index.php?search=${encodeURIComponent(zoekwoord)}`;
    });
</script>

    </body>
</html>
