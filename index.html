<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <title>search.zoek</title>
    <style>
     
  .geel {
  color: #FFFF00;
  }
  .blauw {
  color: #0000FF;
  }
  .groen { 
  color:  #008000;
  }
      button {
            margin-top: 25px;
            padding: 10px 20px;
            font-size: 14px;
            background-color: #f8f9fa;
            border: 1px solid #f8f9fa;
            border-radius: 4px;
            color: #3c4043;
            cursor: pointer;
        }
    input {
  width: 300px;
  padding: 12px 20px;
  font-size: 16px;
  border: 1px solid #ccc;
  border-radius: 25px;
  outline: none;
  box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
}

input:focus {
  border-color: #0000FF;
  box-shadow: 0 2px 8px rgba(0, 0, 0, 0.2);
}
         </style>

</head>
  <body>
      <h1><span class="geel">search</span><span class="blauw">.</span><span class="groen">zoek</span></h1>
    
    <!-- Verander je form-regel naar dit: -->
<form id="zoekformulier">
    <input type="text" name="q" placeholder="Zoek op het web..." required autofocus>
    <button type="submit">Zoeken</button>
</form>

<!-- Hier verschijnen straks jouw resultaten op de pagina -->
<div id="resultaten"></div>

      <script>
    const formulier = document.getElementById('zoekformulier');
    const resultatenVak = document.getElementById('resultaten');

    formulier.addEventListener('submit', async function(event) {
        event.preventDefault();

        const zoekwoord = formulier.q.value;

        // 1. Zet ?q=... netjes in jouw eigen adresbalk bovenaan
        const nieuweUrl = '?q=' + encodeURIComponent(zoekwoord);
        window.history.pushState({}, '', nieuweUrl);

        // 2. Laat zien dat hij aan het zoeken is
        resultatenVak.innerHTML = '<p>Bezig met zoeken...</p>';

        // 3. Haal echte zoekresultaten op via de Wikipedia zoek-API
        const apiUrl = `https://wikipedia.org{encodeURIComponent(zoekwoord)}&format=json&origin=*`;
        
        const antwoord = await fetch(apiUrl);
        const data = await antwoord.json();
        const resultaten = data.query.search;

        // 4. Bouw de resultatenlijst op jouw eigen pagina
        let html = `<h3>Resultaten voor: "${zoekwoord}"</h3>`;

        if (resultaten.length === 0) {
            html += `<p>Geen directe artikelen gevonden op Wikipedia.</p>`;
        } else {
            resultaten.forEach(item => {
                const paginaLink = `https://wikipedia.org{encodeURIComponent(item.title)}`;
                html += `
                    <div style="margin-bottom: 20px; max-width: 600px;">
                        <a href="${paginaLink}" target="_blank" style="font-size: 18px; color: #1a0dab; text-decoration: none; font-weight: bold;">
                            ${item.title}
                        </a>
                        <p style="margin: 5px 0; color: #4d5156; font-size: 14px;">
                            ${item.snippet}...
                        </p>
                    </div>
                `;
            });
        }

        // 5. Zet onderaan ook nog een knop om op Google verder te zoeken
        html += `<hr><p><a href="https://google.com{encodeURIComponent(zoekwoord)}" target="_blank">Verder zoeken op Google naar "${zoekwoord}" →</a></p>`;

        resultatenVak.innerHTML = html;
    });
</script>



    </body>
</html>
