<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <title>search.zoek</title>
    <style>
     
  .geel {
  color: #FFFF00;
  }
  .blauw {
  color: #0000FF;
  }
  .groen { 
  color:  #008000;
  }
      button {
            margin-top: 25px;
            padding: 10px 20px;
            font-size: 14px;
            background-color: #f8f9fa;
            border: 1px solid #f8f9fa;
            border-radius: 4px;
            color: #3c4043;
            cursor: pointer;
        }
    input {
  width: 300px;
  padding: 12px 20px;
  font-size: 16px;
  border: 1px solid #ccc;
  border-radius: 25px;
  outline: none;
  box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
}

input:focus {
  border-color: #0000FF;
  box-shadow: 0 2px 8px rgba(0, 0, 0, 0.2);
}
         </style>

</head>
  <body>
      <h1><span class="geel">search</span><span class="blauw">.</span><span class="groen">zoek</span></h1>
    
    <!-- Verander je form-regel naar dit: -->
<form id="zoekformulier">
    <input type="text" name="q" placeholder="Zoek op het web..." required autofocus>
    <button type="submit">Zoeken</button>
</form>

<!-- Hier verschijnen straks jouw resultaten op de pagina -->
<div id="resultaten"></div>

<script>
    const formulier = document.getElementById('zoekformulier');
    const resultatenVak = document.getElementById('resultaten');

    formulier.addEventListener('submit', function(event) {
        // 1. Zorg dat de pagina NIET doorstuurt of herlaadt
        event.preventDefault();

        // 2. Haal de waarde op uit het vakje met name="q"
        const zoekwoord = formulier.q.value;

        // 3. Toon het zoekwoord en handige klikbare links op jouw eigen pagina
        resultatenVak.innerHTML = `
            <h3>Resultaten voor: "${zoekwoord}"</h3>
            <p><a href="https://google.com{zoekwoord}" target="_blank">Bekijk alle resultaten op Google</a></p>
            <p><a href="https://wikipedia.org{zoekwoord}" target="_blank">Zoek "${zoekwoord}" op Wikipedia</a></p>
            <p><a href="https://youtube.com{zoekwoord}" target="_blank">Zoek video's op YouTube</a></p>
        `;
    });
</script>

    </body>
</html>
